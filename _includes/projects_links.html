{%- if site.projects_links -%}
  <ul class="projects-links">
    {%- for link in site.projects_links -%}
      {%- assign icon_style = link.icon_style | default: "fa-solid" -%}
      <li>
        <a href="{{ link.url | escape }}" target="_blank" rel="noopener">
          <i class="{{ icon_style }} fa-{{ link.icon | default: 'link' }}" aria-hidden="true"></i>
          {{ link.label | escape }}
        </a>
      </li>
    {%- endfor -%}
  </ul>
{%- endif -%}
