---
layout: base
---

<div class="page-wrap{% unless page.toc %} no-toc{% endunless %}{% if page.wide %} wide{% endif %}">
  {% if page.toc %}
    <nav class="toc" aria-label="Table of contents" data-highlight-toc>
      <strong>Table of contents</strong>
      {% include toc.html html=content h_min=2 h_max=5 class="toc-list" %}
    </nav>
  {% endif %}

  <article class="page">
    <a class="back" href="{{ "/" | relative_url }}">Back</a>
    {{ content }}
  </article>
</div>

{% if page.toc %}
  <script src="{{ "/assets/js/toc-highlight.js" | relative_url }}" defer></script>
{% endif %}
